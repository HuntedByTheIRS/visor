name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      V_TAG: '0.5.2'
    steps:
      - name: Install the build tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          # nodejs is for actions/checkout. The image has no node, and a JS
          # action fails with exit 127 before the workflow gets anywhere.
          apt-get install -y -qq git curl make gcc nodejs unzip >/dev/null
          node --version

      - name: Checkout visor
        uses: https://github.com/actions/checkout@v4

      - name: Install the V compiler
        run: |
          # The release asset, not a source build. Building V from source with
          # `make` trips the driver's own memory guard on this runner
          # ("v3 compiler memory usage reached 9994 MiB RSS ... limit: 9984 MiB")
          # during the v2 stage of cmd/v, and it costs minutes per run.
          curl -fsSL -o /tmp/v.zip "https://github.com/vlang/v/releases/download/${V_TAG}/v_linux.zip"
          unzip -q /tmp/v.zip -d /opt
          /opt/v/v version
          echo /opt/v >> "$GITHUB_PATH"

      - name: Build visor
        run: v -o /tmp/visor .

      - name: Version probe
        run: /tmp/visor --version

      - name: Format gate
        run: v fmt -verify .

      - name: Tests
        run: v test .

      - name: Ban compiler internals and the V1 compatibility protocol
        run: |
          if grep -rnE 'import v\.(ast|flat|parser|checker|pref|scanner)' --include='*.v' .; then
            echo "a compiler-internal import slipped in"
            exit 1
          fi
          if grep -rn 'vls-mode\|-line-info' --include='*.v' .; then
            echo "the V1 compatibility protocol is referenced"
            exit 1
          fi
