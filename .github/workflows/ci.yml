name: ci

# GitHub Actions is the only host: the Gitea mirror is archived and read-only.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # visor's lsp module imports json2. V added vlib/json2 after the 0.5.2 tag, so
  # the 0.5.2 release asset cannot build this tree, and no newer release exists
  # yet. vlib/json is deprecated in favour of json2 ("`json` will be removed
  # soon; use the pure V `json2` module instead"), so going back is not an
  # option either. CI therefore builds V master from source.
  V_REPO: 'https://github.com/vlang/v'

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout visor
        uses: actions/checkout@v4

      - name: Install the markdown linter
        run: |
          # Pinned, like the compiler: a linter that gains rules on its own
          # turns a green tree red without a commit behind it.
          npm install -g markdownlint-cli2@0.23.3
          markdownlint-cli2 --version

      - name: Lint the markdown
        run: markdownlint-cli2

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Install the build tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          SUDO=''
          if [ "$(id -u)" != '0' ]; then SUDO=sudo; fi
          $SUDO apt-get update -qq
          # nodejs is for actions/checkout, a JavaScript action. The runner
          # ships it, so the install is normally a no-op; it keeps the job from
          # depending on what the image happens to carry. Without node the job
          # dies at exit 127 before a build step runs.
          # vim is for the installer step: vim-lsp needs +job and +channel,
          # which vim-tiny, if that is what the image carries, does not have.
          $SUDO apt-get install -y -qq git curl make gcc nodejs vim >/dev/null
          node --version

      - name: Checkout visor
        uses: actions/checkout@v4

      - name: Install the V compiler
        run: |
          # From source, because the release asset is a dead end for this tree
          # (see the note on V_REPO above).
          #
          # The bootstrap is what makes this fit in memory: V's Makefile compiles
          # the portable snapshot in vc/v.c with clang, keeping the
          # V1-compatibility executable on the bootstrap path, and walks
          # v1 -> v2 -> v. V3 never enters that chain, so this stays clear of the
          # memory guard that killed this build once before on a smaller runner
          # ("v3 compiler memory usage reached 9994 MiB RSS ... limit: 9984 MiB").
          # Measured here: 187s for the clone plus the build.
          git clone --depth 1 "$V_REPO" "$HOME/vlang"
          cd "$HOME/vlang"
          make
          ./v version
          test -d vlib/json2 || { echo "this V has no vlib/json2; the LSP layer needs it"; exit 1; }
          echo "$HOME/vlang" >> "$GITHUB_PATH"

      - name: Build visor
        run: v -o /tmp/visor .

      # The gate lives in front of the slower steps so a warning fails the job
      # before the tests run. It is a step rather than a job of its own because
      # a second job would build V from source again to reproduce a fourteen
      # second check.
      - name: Warnings gate
        run: v run tools/check_warnings.vsh

      - name: Version probe
        run: /tmp/visor --version

      - name: Format gate
        run: v fmt -verify .

      - name: Tests
        run: v test .

      - name: Protocol smoke test
        run: v run tools/lsp_smoke.vsh --bin /tmp/visor --fixture testdata/smoke

      # The editor tests need a real editor, so one is downloaded rather than
      # taken from the image: Ubuntu's neovim is older than the 0.11 floor the
      # client states, and a run against the wrong version proves nothing.
      # Both ends of the range are covered because the token highlighter is
      # started by a different call either side of 0.12, so the branch that
      # picks between them fails here rather than on someone's desktop. This is
      # a step rather than a job because a second job would build V from source
      # again to reach the binary these tests run against.
      - name: Editor tests
        shell: bash
        run: |
          set -euo pipefail
          editors=''
          for version in v0.11.7 v0.12.5; do
            curl -fsSL -o "/tmp/nvim-$version.tar.gz" \
              "https://github.com/neovim/neovim/releases/download/$version/nvim-linux-x86_64.tar.gz"
            mkdir -p "/tmp/nvim-$version"
            tar -xzf "/tmp/nvim-$version.tar.gz" -C "/tmp/nvim-$version" --strip-components=1
            editors="$editors --nvim /tmp/nvim-$version/bin/nvim"
          done
          v run tools/editor_test.vsh --bin /tmp/visor $editors

      # The installer is what a user runs, so it gets a run here rather than a
      # reader's trust. --root keeps it out of the runner's home and --bin
      # installs the binary this job already built. What is checked is what this
      # job can check honestly: the files land where the profile expects them,
      # Vim's client comes up from the generated vimrc, and the Neovim profile
      # attaches to a real server. It runs after the editor tests because it uses
      # the Neovim they downloaded.
      - name: Installer
        shell: bash
        run: |
          set -euo pipefail
          root=$(mktemp -d)
          v run tools/install_lsp.vsh nvim vim --root "$root" --bin /tmp/visor

          test -x "$root/.local/bin/visorvim"
          test -x "$root/.local/bin/visorvim-vim"
          test -f "$root/.config/visorvim/init.lua"
          test -f "$root/.config/visorvim-vim/visorvim-vim.vimrc"
          test -d "$root/.config/visorvim-vim/vim-lsp/autoload"

          printf 'fn main() {}\n' > "$root/main.v"

          # Vim reads the generated vimrc instead of a user's own, and the
          # client has to be there when it starts.
          HOME="$root" vim -u "$root/.config/visorvim-vim/visorvim-vim.vimrc" -es \
            -c 'if exists(":LspStatus") != 2 | cquit | endif' -c 'qa!' < /dev/null

          # The installed command starts Neovim under the profile, and the
          # client attaches: that is the whole point of an install. Headless
          # Neovim writes its messages to stderr, so that is where the line is.
          #
          # --root writes the profile under the root it was given, and Neovim
          # reads $XDG_CONFIG_HOME when the image sets it, so the variable is
          # pointed at the root here. The first check says where Neovim actually
          # looked, because a profile nothing reads is the failure to catch.
          export XDG_CONFIG_HOME="$root/.config"
          env | grep -i '^XDG_' || true

          # A --root run and a set XDG_CONFIG_HOME disagree about where the
          # editor looks. The tool says so rather than leaving it to be found
          # later, and this is where that sentence is checked.
          XDG_CONFIG_HOME=/tmp/not-where-the-profile-is \
            v run tools/install_lsp.vsh nvim --root "$root" --bin /tmp/visor -n |
            grep -q 'XDG_CONFIG_HOME is set'

          HOME="$root" PATH="$root/.local/bin:/tmp/nvim-v0.12.5/bin:$PATH" \
            visorvim --headless -c \
            'lua print("config: " .. vim.fn.stdpath("config"))' -c 'qa!' 2>&1 | tee /tmp/profile.log
          grep -qx "config: $root/.config/visorvim" /tmp/profile.log

          out=$(HOME="$root" PATH="$root/.local/bin:/tmp/nvim-v0.12.5/bin:$PATH" \
            visorvim --headless \
            -c "edit $root/main.v" \
            -c 'lua vim.wait(30000, function() return #vim.lsp.get_clients() > 0 end)' \
            -c 'lua print("visor clients: " .. #vim.lsp.get_clients())' \
            -c 'qa!' 2>&1) || true
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'visor clients: 1'

      - name: Ban compiler internals and the V1 compatibility protocol
        run: |
          if grep -rnE 'import v\.(ast|flat|parser|checker|pref|scanner)' --include='*.v' .; then
            echo "a compiler-internal import slipped in"
            exit 1
          fi
          if grep -rn 'vls-mode\|-line-info' --include='*.v' .; then
            echo "the V1 compatibility protocol is referenced"
            exit 1
          fi
